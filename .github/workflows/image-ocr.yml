name: Image OCR - Research Reports

on:
  workflow_dispatch:
    inputs:
      image_url:
        description: "图片 URL (可选，不填则处理 reports/ 目录)"
        required: false
        default: ""
      lang:
        description: "OCR 语言 (eng/chi_sim/chi_tra/jpn/kor)"
        required: false
        default: "chi_sim"

# 手动触发: gh workflow run image-ocr.yml --repo Jackliu-teadrinker/ai-news-radar

concurrency:
  group: ocr-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  ocr:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Tesseract.js
        run: npm install tesseract.js

      - name: Install Tesseract language data (Chinese)
        run: |
          # Tesseract.js auto-downloads lang data, but pre-cache here for speed
          mkdir -p ~/.tesseractrc/
          node -e "
            const {createWorker} = require('tesseract.js');
            (async()=>{
              const w = await createWorker('chi_sim');
              await w.terminate();
              console.log('chi_sim downloaded');
            })();
          " || true

      - name: Prepare output dir
        run: mkdir -p data/ocr-results

      - name: Run OCR on single image URL
        if: github.event.inputs.image_url != ''
        env:
          IMAGE_URL: ${{ github.event.inputs.image_url }}
          OCR_LANG: ${{ github.event.inputs.lang || 'chi_sim' }}
        run: |
          node << 'EOF'
          const { createWorker } = require('tesseract.js');
          const fs = require('fs');
          const path = require('path');
          const https = require('https');
          const http = require('http');
          const { URL } = require('url');

          const imageUrl = process.env.IMAGE_URL;
          const lang = process.env.OCR_LANG || 'chi_sim';
          const outDir = 'data/ocr-results';
          const tmpFile = `/tmp/ocr_input_${Date.now()}`;

          function download(url) {
            return new Promise((resolve, reject) => {
              const parsed = new URL(url);
              const protocol = parsed.protocol === 'https:' ? https : http;
              const req = protocol.get(url, { headers: { 'User-Agent': 'Mozilla/5.0' } }, (res) => {
                if ([301, 302, 303, 307, 308].includes(res.statusCode) && res.headers.location) {
                  return download(res.headers.location).then(resolve).catch(reject);
                }
                // Detect extension from content-type
                const ct = (res.headers['content-type'] || 'image/png').split(';')[0];
                const ext = ct.replace('image/', '').replace('jpeg', 'jpg');
                const filePath = tmpFile + '.' + ext;
                const stream = fs.createWriteStream(filePath);
                res.pipe(stream);
                stream.on('close', () => resolve(filePath));
                stream.on('error', reject);
              });
              req.on('error', reject);
            });
          }

          (async () => {
            console.log(`[OCR] Downloading: ${imageUrl}`);
            const downloadedFile = await download(imageUrl);
            console.log(`[OCR] Recognizing (lang=${lang})...`);
            const worker = await createWorker(lang, 1, {
              logger: m => {
                if (m.status === 'recognizing text') {
                  process.stderr.write(`\r[OCR] ${(m.progress*100).toFixed(0)}%`);
                }
              }
            });
            const { data: { text, confidence } } = await worker.recognize(downloadedFile);
            await worker.terminate();
            process.stderr.write('\n');

            const timestamp = new Date().toISOString().replace(/[:.]/g, '-');
            const baseName = `ocr_${timestamp}`;
            const resultFile = path.join(outDir, `${baseName}.txt`);
            const metaFile = path.join(outDir, `${baseName}.meta.json`);

            fs.writeFileSync(resultFile, text.trim() || '[No text detected]');
            fs.writeFileSync(metaFile, JSON.stringify({
              source: imageUrl,
              lang,
              confidence,
              timestamp: new Date().toISOString()
            }, null, 2));

            console.log(`[OCR] Done! Confidence: ${confidence.toFixed(1)}%`);
            console.log(`[OCR] Result saved to ${resultFile}`);
            console.log(`\n--- OCR Result ---\n${text.trim() || '[No text detected]'}`);
            try { fs.unlinkSync(downloadedFile); } catch(e) {}
          })().catch(e => { console.error(e); process.exit(1); });
          EOF

      - name: Scan reports/ directory for images
        if: github.event.inputs.image_url == ''
        run: |
          echo "No image URL provided. To OCR a specific image, use the image_url input."
          echo "Reports directory contents:"
          ls -la reports/ 2>/dev/null | head -20 || echo "No reports/ directory found"

      - name: Commit OCR results
        run: |
          if [ -d "data/ocr-results" ] && [ "$(ls -A data/ocr-results/*.txt 2>/dev/null)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/ocr-results/
            if ! git diff --cached --quiet; then
              git commit -m "chore: add OCR results $(date -u +%Y-%m-%d)"
              git push
              echo "OCR results committed"
            else
              echo "No new OCR results to commit"
            fi
          else
            echo "No OCR results to commit"
          fi
