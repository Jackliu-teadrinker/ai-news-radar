name: Deploy to GitHub Pages

# ⚠️ 已禁用：update-news.yml 已包含 deploy-pages 步骤，两者同时部署会冲突
# 如需手动触发部署，请使用 update-news.yml 的 workflow_dispatch

on: []

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
