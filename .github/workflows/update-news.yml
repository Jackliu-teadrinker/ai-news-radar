name: Update AI News Radar

on:
  push:
    branches:
      - master
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  # FIX(2026-08-27): schedule 走独立 group，永不被 dispatch/push cancel;
  #                  只 dispatch 之间互抢（保证手动只跑最新一次）。
  group: >-
    update-news-${{ github.event_name == 'schedule' && 'schedule' || github.event_name }}${{ github.event_name == 'workflow_dispatch' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    name: Fetch & deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate Python syntax
        run: |
          python -m py_compile scripts/update_news.py
          python -m py_compile scripts/curated_collector.py

      - name: Run update
        env:
          TZ: Asia/Shanghai
        run: python scripts/update_news.py --output-dir data --window-hours 24 --rss-opml feeds/follow.example.opml --custom-opml feeds/custom.opml --archive-days 21

      - name: Fetch arXiv papers
        env:
          TZ: Asia/Shanghai
        run: python scripts/arxiv_fetcher.py --output-dir data --window-hours 24

      - name: Fetch government news
        env:
          TZ: Asia/Shanghai
        run: python scripts/government_fetcher.py

      - name: Fetch Toutiao news
        env:
          TZ: Asia/Shanghai
        run: python scripts/toutiao_fetcher.py

      - name: Curate high-quality articles
        env:
          TZ: Asia/Shanghai
        run: python scripts/curated_collector.py --data-path data/latest-24h-min.json --curated-dir data/curated

      - name: Update index.html version hash
        run: python -c "import re; from datetime import datetime, timezone; c=open('index.html','r',encoding='utf-8').read(); now=datetime.now(timezone.utc).strftime('%Y%m%d%H%M%S'); c2=re.sub(r'(<script src=\"./assets/app\\.js\\?v=)[^\"]*\"', r'\g<1>'+now+'\"', c); open('index.html','w',encoding='utf-8').write(c2); print('[OK] version:',now)"

      - name: Auto-push data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.email "radar-bot@users.noreply.github.com"
          git config user.name "radar-bot"
          touch data/wechat-articles.json
          # FIX(2026-08-07): scripts/feeds/ 路径不存在（feeds/ 在仓库根目录），导致 git add
          # 整体 fatal 失败 → 数据从 2026-07-21 起从未 push 到 git。已改回正确路径。
          # 同时移除 2>/dev/null || true：git add 失败必须显式报错，不能静默吞掉。
          git add data/ feeds/ index.html
          if git diff --cached --quiet; then
            echo "[SKIP] no changes staged"
          else
            git commit -m "[radar-auto] data refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin master || echo "[WARN] push failed"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: false
        continue-on-error: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
        continue-on-error: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
        timeout-minutes: 5
