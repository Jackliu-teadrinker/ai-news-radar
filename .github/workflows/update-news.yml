name: Update AI News Radar

on:
  push:
    branches:
      - master
  schedule:
    # Primary: every 30 min
    - cron: "*/30 * * * *"
    # Backup: 3 AM UTC = 11 AM Beijing
    - cron: "0 3 * * *"
    # Backup: 8 PM UTC = 4 AM Beijing (off-peak recovery)
    - cron: "0 20 * * *"
  # Jack 2026-06-09: 主采集锚点 = CST 19:00（脚本内 WINDOW_START 自动判断）
  # cron 保持 */30 高频轮询；脚本在 19:00 那一轮跑完整 24h 窗口
  workflow_dispatch:

concurrency:
  group: update-ai-news-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write
  # NOTE: 'actions: write' intentionally NOT granted.
  # Self-dispatch causes infinite loops.
  # See radar-health-check.yml for the dedicated watchdog with cooldown.

jobs:
  update:
    name: Fetch & deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate Python syntax
        run: |
          echo "=== Validating update_news.py ==="
          python -m py_compile scripts/update_news.py
          echo "update_news.py: OK"
          echo "=== Validating curated_collector.py ==="
          python -m py_compile scripts/curated_collector.py
          echo "curated_collector.py: OK"
          echo "=== Syntax check passed ==="

      - name: Run update
        env:
          TZ: Asia/Shanghai
        run: python scripts/update_news.py --output-dir data --window-hours 24 --rss-opml feeds/follow.example.opml --archive-days 21

      - name: Curate high-quality articles
        # Jack 2026-06-10 18:58 CST: 方案 A
        # 从 latest-24h-min.json 筛 total_score >= 80 入 data/curated/YYYY-MM-DD.json
        # 阈值 60 太宽（实际 score 范围 60-130），80 = top ~50/天
        # 跨 24h dedup (sha1(url))，单日上限 50
        # 必须在 Auto-push data 之前：curated/ 文件要存在才能被 push
        env:
          TZ: Asia/Shanghai
        run: python scripts/curated_collector.py --data-path data/latest-24h-min.json --curated-dir data/curated

      - name: Update index.html version hash
        # Forces browsers to re-fetch app.js, preventing stale UI bugs
        run: python .github/workflows/update-index-version.py

      - name: Auto-push data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/workflows/gh_auto_push_data.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
