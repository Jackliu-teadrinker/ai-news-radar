name: Update AI News Snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

concurrency:
  group: update-ai-news-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare OPML
        run: |
          mkdir -p feeds
          if [ -f feeds/follow.opml ]; then
            echo "Using local feeds/follow.opml from repo"
            GN_COUNT=$(grep -c "news.google.com" feeds/follow.opml || echo "0")
            echo "OPML validation: $GN_COUNT GN sources found"
          elif [ -f feeds/follow.example.opml ]; then
            cp feeds/follow.example.opml feeds/follow.opml
            echo "WARNING: Using example OPML - no custom feeds configured"
          else
            echo "ERROR: No OPML file available"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Run update_news.py FIRST to generate fresh data, then score the new data
      - name: Update data
        run: |
          echo "Running update_news.py to generate fresh snapshot..."
          python scripts/update_news.py
      - name: Inject 5-dimension scores
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Reading latest-24h-min.json (fresh from update_news.py)..."
          node scripts/score_injector_gh.js

      - name: Commit and push changes
        env:
          EMAIL_DIGEST_PUBLISH: ${{ secrets.EMAIL_DIGEST_PUBLISH || vars.EMAIL_DIGEST_PUBLISH }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest-24h.json data/latest-24h-all.json data/latest-24h-min.json data/archive.json data/source-status.json data/waytoagi-7d.json data/title-zh-cache.json
          if [ -f data/email-digest.json ] && [ "$EMAIL_DIGEST_PUBLISH" = "1" ]; then
            git add data/email-digest.json
          fi
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update ai news snapshot"
            git push
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          pagename: ""

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
