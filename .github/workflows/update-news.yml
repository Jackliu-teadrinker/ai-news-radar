name: Update AI News Radar

on:
  # 2026-10-15: 移除 push 触发。数据刷新（30 feed + 摘要提取 + 翻译，实测 13-16min）
  # 不该由"推代码"驱动——推一次 UI/脚本改动就跑一遍完整采集，纯属浪费 runner，
  # 还会把 schedule 拍点挤掉。实测更新间隔从 ~30min 恶化到 100-270min，起点正是
  # 10-14 10:03 起本会话开始频繁推代码。修复后推代码只改文件，不触发采集。
  schedule:
    # 2026-09-15: 回滚到整点 30 分钟拍。15 分钟错位拍（04/19/34/49）导致
    # "更新时间"永远显示 08:00/08:30 这种错位快照，观感像卡住。
    # 整点拍 + run 耗时 ~11min → 数据落点 ≈ 整点前 4min，观感"刚过整点就刷新"。
    # 掉拍风险由 Keeper（20min 巡检 + rescue dispatch）兜底，可接受。
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  # 2026-10-15 重写。旧配置的致命缺陷：
  #   group: update-news-${schedule?'schedule':event_name}${dispatch?'-{run_id}':''}
  # dispatch 分支带 run_id 后缀 → 每次手动触发都是"独立 group"，
  # 于是多个 dispatch 互不排队、并发抢占 runner，schedule 拍点被挤掉，
  # 更新间隔一路劣化到 100-270min（且 watchdog 每次 ALERT 都再补一刀 dispatch，
  # 进一步放大并发量）。
  #
  # 新配置：
  #   - schedule 独占 group update-news-schedule，cancel-in-progress: false
  #     （绝不打断正在跑的数据刷新，否则那一轮数据推不上 Pages）；
  #   - dispatch 独立 group update-news-dispatch，cancel-in-progress: true
  #     （手动触发可被后一次打断，只保留最新一次，不堆积）。
  group: update-news-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    name: Fetch & deploy
    runs-on: ubuntu-latest
    # 2026-09-30: 20→35。单跑 Run update 常 13-16min（30 feed 重试 + enrich 123s
    # + 翻译 126 英文标题 + huxiu 校准），再叠 arXiv/政府/头条/部署，20min 撞线
    # 会被 cancel 导致数据推不上 Pages（9/30 05:43 run 即栽在这）。35min 留足余量。
    timeout-minutes: 35
    # 数据刷新是唯一对外 SLA（页面"更新时间"），排在代码构建之前。
    # 默认 runner 调度权重足够；如需更高优先级考虑 GitHub Plans。
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # 2026-10-20 GN 边缘代理（Bug #27 治根）：配了 secret GN_PROXY_BASE_URL
    # （Cloudflare Worker 地址）时，update_news.py 把 Google News RSS 抓取改走
    # 边缘出口，绕开 GitHub 云段 IP 被 Google 限流。secret 未设时此变量为空，
    # 抓取走原直连 + Bing 兜底。Worker 源码见 workers/gn-proxy/index.js，部署后在
    # repo Settings → Secrets and variables → Actions 加 GN_PROXY_BASE_URL。
    env:
      GN_PROXY_BASE_URL: ${{ secrets.GN_PROXY_BASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pre-flight checks
        run: |
          echo "============================================================"
          echo "  PRE-FLIGHT CHECKS (defense against 2026-08-30 incidents)"
          echo "============================================================"

          # 1. Python syntax check (catches typo, literal `n)
          python -m py_compile scripts/update_news.py
          python -m py_compile scripts/curated_collector.py
          echo "[OK] Python syntax check passed"

          # 2. Literal backtick-n check (defense against bc58c191)
          if grep -nP "\`n" scripts/*.py 2>/dev/null; then
            echo "ERROR: literal backtick-n found in scripts (bc58c191 regression)"
            exit 1
          fi
          echo "[OK] No literal backtick-n found"

          # 3. Common typo check (defense against output_dirtput_dir etc.)
          if grep -nE "(output_dirtput|window_hourss)" scripts/*.py; then
            echo "ERROR: known typo found in scripts"
            exit 1
          fi
          echo "[OK] No known typos"

          # 3b. Conflict-marker check (defense against 2026-10-10 incident)
          # local_refresh.sh 的 merge 冲突处理曾把 <<<<<<< / ======= / >>>>>> 连同
          # 24 份重复页面提交并推上 master，Pages 上裸奔 83 个 commit。
          # 任何被跟踪的源文件带冲突标记都必须在流水线启动前拦下。
          if grep -lE '^(<<<<<<<|>>>>>>>|=======)$' index.html scripts/*.py .github/workflows/*.yml 2>/dev/null; then
            echo "ERROR: git conflict markers found in tracked files (2026-10-10 incident)"
            exit 1
          fi
          echo "[OK] No conflict markers"

          # 4. Time window regression test (defense against 2026-08-30 inversion)
          # Run unit tests BEFORE doing the expensive RSS fetch
          pip install pyyaml > /dev/null 2>&1 || true
          python tests/test_time_window.py
          echo "[OK] Time window regression test passed"

          echo "============================================================"
          echo "  ALL PRE-FLIGHT CHECKS PASSED"
          echo "============================================================"

      - name: Run update
        env:
          TZ: Asia/Shanghai
        run: python scripts/update_news.py --output-dir data --window-hours 24 --rss-opml feeds/follow.example.opml --custom-opml feeds/custom.opml --archive-days 21

      - name: Fetch arXiv papers
        env:
          TZ: Asia/Shanghai
        run: python scripts/arxiv_fetcher.py --output-dir data --window-hours 24

      - name: Fetch government news
        env:
          TZ: Asia/Shanghai
        run: python scripts/government_fetcher.py

      - name: Fetch Toutiao news
        env:
          TZ: Asia/Shanghai
        run: python scripts/toutiao_fetcher.py

      - name: Curate high-quality articles
        env:
          TZ: Asia/Shanghai
        run: python scripts/curated_collector.py --data-path data/latest-24h-min.json --curated-dir data/curated

      - name: Update index.html version hash
        run: python -c "import re; from datetime import datetime, timezone; c=open('index.html','r',encoding='utf-8').read(); now=datetime.now(timezone.utc).strftime('%Y%m%d%H%M%S'); c2=re.sub(r'(<script src=\"./assets/app\\.js\\?v=)[^\"]*\"', r'\g<1>'+now+'\"', c); open('index.html','w',encoding='utf-8').write(c2); print('[OK] version:',now)"

      - name: Auto-push data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.email "radar-bot@users.noreply.github.com"
          git config user.name "radar-bot"
          touch data/wechat-articles.json
          # 2026-09-30 GUARD: 空数据/异常缩水拒推。
          # 09:54 事故教训：一次 run 把 330 条清空推上 Pages，UI 直接空白。
          # 规则：items==0 → 用 git HEAD 里的旧快照回滚，跳过本次 push（旧数据继续服务）。
          #       items < 10 → 打 WARN（可能真在低活跃时段，允许推送）。
          # 2026-10-20 GUARD v2（本次事故根治）：
          #  10-20 02:01 那轮 GN RSS 集体 503 + 国内 GN timeout_45s，整轮只采到 1 条。
          #  旧 GUARD 只防 n==0，n<10 打一条 WARN 后照推，于是 180 条健康快照
          #  （00:50）被 1 条坏快照覆盖，Pages 几乎空了。
          #  修法：n<10 时对照 git HEAD 旧快照的条数，若 new < 0.5*prev 且
          #  prev 明显健康(>=20)，判定为采集端塌方（GN 503 等）而非低活跃时段，
          #  直接回滚、跳过 push，绝不用坏数据覆盖健康数据。
          python - <<'EOF'
          import json, subprocess, sys
          d = json.load(open('data/latest-24h-min.json'))
          n = d.get('total_items', 0)
          # 读 git HEAD（上一个已提交快照）的条数作对照
          try:
              prev_raw = subprocess.check_output(
                  ['git', 'show', 'HEAD:data/latest-24h-min.json'],
                  stderr=subprocess.DEVNULL)
              prev = json.loads(prev_raw).get('total_items', 0)
          except Exception:
              prev = 0
          print(f"[GUARD] current total_items = {n} | last committed = {prev}")
          if n == 0:
              print("[GUARD] EMPTY DATA — refusing to push; rolling back to last good snapshot")
              sys.exit(2)
          if n < 10 and prev >= 20 and n < 0.5 * prev:
              print(f"[GUARD] COLLAPSE DETECTED: {n} vs prev {prev} "
                    f"(likely GN 503 / mass source failure) — refusing to push; "
                    f"rolling back to last good snapshot")
              sys.exit(2)
          if n < 10:
              print("[GUARD] WARN: unusually low item count, pushing with caution")
          EOF
          if [ $? -eq 2 ]; then
            git checkout HEAD -- data/latest-24h-min.json
            echo "[GUARD] rolled back data/latest-24h-min.json to last good snapshot; skipping push this cycle"
            exit 0
          fi
          # FIX(2026-08-07): scripts/feeds/ 路径不存在（feeds/ 在仓库根目录），导致 git add
          # 整体 fatal 失败 → 数据从 2026-07-21 起从未 push 到 git。已改回正确路径。
          # 同时移除 2>/dev/null || true：git add 失败必须显式报错，不能静默吞掉。
          git add data/ feeds/ index.html
          if git diff --cached --quiet; then
            echo "[SKIP] no changes staged"
          else
            git commit -m "[radar-auto] data refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin master || echo "[WARN] push failed"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: false
        continue-on-error: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
        continue-on-error: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
        timeout-minutes: 5
