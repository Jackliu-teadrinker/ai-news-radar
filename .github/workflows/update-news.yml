name: Collect AI News Radar Data

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

# Don't cancel this workflow when new runs start (multiple collection runs can queue)

concurrency:
  group: radar-collect-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout radar-data branch
        uses: actions/checkout@v4
        with:
          ref: radar-data

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run update + commit + push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_EMAIL: "865715887@qq.com"
          GIT_NAME: "Jack"
        run: |
          git config --global user.email "$GIT_EMAIL"
          git config --global user.name "$GIT_NAME"

          # Run v2: GN feeds expanded + 5-cat bypass
          python scripts/update_news_v2.py

          # Save daily archive
          DATE_DIR=$(date +%Y-%m-%d)
          mkdir -p "data/archives/$DATE_DIR"
          cp data/latest-24h.json "data/archives/$DATE_DIR/latest-24h.json"
          echo "[INFO] Daily archive saved to data/archives/$DATE_DIR/"

          # Commit data files (v2 writes: latest-24h.json, latest-24h-min.json, latest-24h-all.json)
          git add data/latest-24h.json data/latest-24h-min.json data/latest-24h-all.json data/archives/
          git commit -m "chore: update news data $(date +%Y-%m-%d' '%H:%M)" || echo "Nothing to commit"
          git push origin radar-data || echo "Push failed"

      - name: Update HTML cache buster
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_EMAIL: "865715887@qq.com"
          GIT_NAME: "Jack"
        run: |
          python .github/workflows/gh_push_data.py
          git add assets/app.js
          git commit -m "chore: bump app.js version" || echo "Nothing to commit"
          git push origin radar-data || echo "Push failed"


