name: Update AI News Snapshot

on:
  # push触发：本地cron推送新数据时自动部署
  push:
    branches:
      - master
    paths:
      - data/latest-24h-min.json
      - data/latest-24h.json
  # 定时触发：每30分钟（作为备用兜底，本地cron优先）
  schedule:
    - cron: "5,35 * * * *"
  # 手动触发
  workflow_dispatch:

concurrency:
  group: update-ai-news-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # ── 只做部署（数据由本地pipeline推送更新）──
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
