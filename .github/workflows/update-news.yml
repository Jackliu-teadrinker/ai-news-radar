# ============================================================
# ai-news-radar v2 — GitHub Actions Workflow
# Replaces: .github/workflows/update-news.yml
#
# What changed from v1:
#   - Runs scripts/update_news_v2.py (not update_news.py)
#   - No ai_relevance.py scoring (replaced by route_to_category in v2)
#   - Outputs directly to data/latest-24h.json
#   - RSSHub sources SKIPPED when RSSHUB_HOST="" (GitHub Actions environment)
#   - arXiv will fail gracefully (blocked from GitHub Actions IPs)
#   - No gh_push_data.py step — commit+push to master triggers Pages rebuild
# ============================================================

name: Update AI News Radar (v2)

on:
  workflow_dispatch:
    inputs:
      skip_rsshub:
        description: "Skip RSSHub sources (always on GitHub Actions)"
        required: false
        default: "true"
        type: boolean

  push:
    branches:
      - master
    paths:
      - scripts/update_news_v2.py
      - .github/workflows/update-news-v2.yml
      - data/**

  schedule:
    - cron: "*/30 * * * *"

concurrency:
  group: update-ai-news-v2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      # --------------------------------------------------------
      # Run radar v2 update
      # RSSHUB_HOST="" tells update_news_v2.py to skip RSSHub
      # sources (Baidu News, WeChat) since they're on Jack's
      # localhost:1200 and not accessible from GitHub Actions.
      # arXiv will also fail gracefully (blocked from GA IPs).
      # --------------------------------------------------------
      - name: Run radar update
        run: python scripts/update_news_v2.py
        env:
          RSSHUB_HOST: ""
          # If RSSHUB_HOST is empty or unset, update_news_v2.py
          # should skip RSSHub-based sources and continue with GN RSS.
          # ArXiv is attempted but will fail gracefully if blocked.

      # --------------------------------------------------------
      # Commit and push only data/latest-24h.json if it changed.
      # This push to master triggers GitHub Pages rebuild.
      # No gh_push_data.py needed — we're running in the main repo.
      # --------------------------------------------------------
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest-24h.json
          if git diff --cached --quiet; then
            echo "No changes to data/latest-24h.json — skipping commit"
            exit 0
          fi
          git commit -m "chore: update radar data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push

      # --------------------------------------------------------
      # Optional: re-trigger Pages if the above push doesn't do it
      # (Pages watches master branch by default).
      # Commented out — Pages should auto-rebuild on master push.
      # Uncomment only if Pages deploy is separate from the main push.
      # --------------------------------------------------------
      # - name: Trigger Pages rebuild
      #   uses: actions/checkout@v4
      #   with:
      #     ref: gh-pages
      #     fetch-depth: 0
      #   if: false  # disabled — master push triggers Pages by default
