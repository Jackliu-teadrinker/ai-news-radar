name: Update AI News Radar

on:
  push:
    branches:
      - master
  schedule:
    - cron: "*/30 * * * *"
    - cron: "0 3 * * *"
    - cron: "0 20 * * *"
  workflow_dispatch:

concurrency:
  group: update-ai-news-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    name: Fetch & deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── Syntax validation ───────────────────────────────────────────────
      - name: Validate Python syntax
        run: |
          python -m py_compile backend/pipeline/run.py
          python -m py_compile backend/curators/daily.py

      # ── Run backend pipeline ─────────────────────────────────────────────
      - name: Run pipeline
        env:
          TZ: Asia/Shanghai
          WECHAT_COLLECTOR_ENABLED: "1"
        run: python -m backend.pipeline.run \
          --output-dir data \
          --window-hours 24 \
          --rss-opml feeds/follow.opml \
          --archive-days 21

      # ── Curate high-quality articles ─────────────────────────────────────
      - name: Curate daily
        env:
          TZ: Asia/Shanghai
        run: python -m backend.curators.daily --data-path data/latest-24h-min.json --curated-dir data/curated

      # ── Update version hash on root index.html ──────────────────────────
      - name: Bump version hash
        run: |
          python -c "
          import re
          from datetime import datetime, timezone
          f = 'index.html'
          c = open(f, 'r', encoding='utf-8').read()
          now = datetime.now(timezone.utc).strftime('%Y%m%d%H%M%S')
          c2 = re.sub(r'(<script src=\"./assets/app\.js\?v=)[^\"]*\"', r'\g<1>'+now+'\"', c)
          open(f, 'w', encoding='utf-8').write(c2)
          print('[OK] version:', now)
          "

      # ── Always commit & push data (no diff heuristics) ──────────────────
      - name: Commit & push data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.email "radar-bot@users.noreply.github.com"
          git config user.name "radar-bot"
          git add data/ index.html
          if git diff --cached --quiet; then
            echo "[SKIP] nothing changed"
          else
            git commit -m "[radar-auto] data refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin master
            echo "[OK] pushed"
          fi

      # ── Deploy to GitHub Pages ──────────────────────────────────────────
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          build_type: none

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        timeout-minutes: 10
