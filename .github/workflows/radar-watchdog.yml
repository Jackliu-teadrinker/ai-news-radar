name: Radar Health Check (Watchdog)

# Independent watchdog: detects whether the **Update AI News Radar** workflow
# has actually been running on schedule, and triggers recovery when it hasn't.
#
# Three-tier response (based on Update AI News Radar's last **schedule run** age):
#   healthy  (<90 min):   write health.json, do nothing
#   stale    (90-360m):   trigger Update AI News Radar, write health.json
#   broken   (>=6h):      open GitHub Issue (no auto-trigger to avoid spam)
#
# Jack 2026-06-22 P0 FIX: the previous design used master commit age as the
# health signal, but the watchdog itself writes a commit every ~15 min, which
# masked the actual main-collection staleness. The new design queries the
# GitHub Actions API for the **last schedule run of Update AI News Radar**
# (workflow_id=275811952), authenticated with GITHUB_TOKEN (1000/h rate limit
# vs 60/h anonymous). This signal is independent of watchdog's own commits
# and reflects the true main-collection freshness.

on:
  schedule:
    # Three independent cron buckets to avoid same-slot scheduler skips
    # (see docs/workflow-cron-diversification.md 2026-06-15 plan, deployed 2026-06-22).
    # - 5,35:  offset 5min from main collection (*/30 -> 0,30)
    # - 25:    independent hourly bucket
    # - 0 6,18: independent time-of-day slots (UTC)
    - cron: "5,35 * * * *"
    - cron: "25 * * * *"
    - cron: "0 6,18 * * *"
  workflow_dispatch:

# Avoid stacking concurrent watchdog runs
concurrency:
  group: radar-watchdog
  cancel-in-progress: true

permissions:
  contents: write
  actions: read
  issues: write

jobs:
  check-and-trigger:
    name: Detect + respond
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query Update AI News Radar last schedule run
        id: update_news_age
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Jack 2026-06-22 P0 fix: query GitHub Actions API for the last
          # schedule run of Update AI News Radar (workflow_id=275811952).
          # GITHUB_TOKEN gives 1000/h rate limit (vs 60/h anonymous).
          # Use per_page=1 + event=schedule to get only the latest schedule run.
          RESP=$(curl -sS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/Jackliu-teadrinker/ai-news-radar/actions/runs?workflow_id=275811952&event=schedule&per_page=1")
          COUNT=$(echo "$RESP" | jq -r '.total_count // 0')
          if [ "$COUNT" = "0" ] || [ "$COUNT" = "null" ]; then
            echo "::warning::No schedule runs found for update-news workflow; treating as broken"
            echo "last_schedule_at=" >> "$GITHUB_OUTPUT"
            echo "update_news_age_minutes=99999" >> "$GITHUB_OUTPUT"
            echo "update_news_run_id=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LAST_AT=$(echo "$RESP" | jq -r '.workflow_runs[0].created_at')
          LAST_CONCLUSION=$(echo "$RESP" | jq -r '.workflow_runs[0].conclusion // "unknown"')
          LAST_ID=$(echo "$RESP" | jq -r '.workflow_runs[0].id // 0')
          NOW=$(date -u +%s)
          LAST_EPOCH=$(date -d "$LAST_AT" +%s)
          AGE_MIN=$(( (NOW - LAST_EPOCH) / 60 ))
          echo "Update AI News Radar last schedule run:"
          echo "  run_id=$LAST_ID"
          echo "  created_at=$LAST_AT"
          echo "  conclusion=$LAST_CONCLUSION"
          echo "  age_minutes=$AGE_MIN"
          echo "last_schedule_at=$LAST_AT" >> "$GITHUB_OUTPUT"
          echo "update_news_age_minutes=$AGE_MIN" >> "$GITHUB_OUTPUT"
          echo "update_news_run_id=$LAST_ID" >> "$GITHUB_OUTPUT"
          echo "update_news_conclusion=$LAST_CONCLUSION" >> "$GITHUB_OUTPUT"

      - name: Check master commit age (legacy signal, retained for compatibility)
        id: commit_age
        run: |
          set -euo pipefail
          # Legacy signal — kept because some downstream tooling reads
          # commit_age_minutes. The PRIMARY health signal is now
          # update_news_age_minutes (above), which is independent of this
          # watchdog's own commits.
          COMMIT_TIME=$(curl -sS https://api.github.com/repos/Jackliu-teadrinker/ai-news-radar/commits/master \
            | jq -r '.commit.author.date')
          echo "Last commit time (UTC): $COMMIT_TIME"
          NOW=$(date -u +%s)
          COMMIT_EPOCH=$(date -d "$COMMIT_TIME" +%s)
          AGE_MIN=$(( (NOW - COMMIT_EPOCH) / 60 ))
          echo "Master commit age: ${AGE_MIN} min"
          echo "commit_time=$COMMIT_TIME" >> "$GITHUB_OUTPUT"
          echo "commit_age_minutes=$AGE_MIN" >> "$GITHUB_OUTPUT"

      - name: Determine status
        id: status
        run: |
          set -euo pipefail
          # PRIMARY signal: Update AI News Radar last schedule run age
          AGE_MIN=${{ steps.update_news_age.outputs.update_news_age_minutes }}
          if [ "$AGE_MIN" -lt 90 ]; then
            STATUS="healthy"
            ACTION="none"
          elif [ "$AGE_MIN" -lt 360 ]; then
            STATUS="stale"
            ACTION="trigger"
          else
            STATUS="broken"
            ACTION="alert"
          fi
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          echo "action=$ACTION" >> "$GITHUB_OUTPUT"
          echo "Decision (based on update_news schedule run): status=$STATUS action=$ACTION (age=${AGE_MIN}m)"

      - name: Trigger main collection
        if: steps.status.outputs.action == 'trigger'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "Triggering main collection workflow (action=trigger because update-news last schedule age=${{ steps.update_news_age.outputs.update_news_age_minutes }}m)..."
          gh workflow run "Update AI News Radar" --repo Jackliu-teadrinker/ai-news-radar
          echo "Dispatched. Waiting 60s for downstream observation..."
          sleep 60

      - name: "Self-monitor: track our own heartbeat"
        id: self_monitor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # FIX (2026-07-13): 正确获取 watchdog 上一次独立 schedule 触发的运行时间。
          # 之前用 per_page=3 取 [1] 作为"上次"，但这会在 watchdog 只跑过一次时取到
          # 当前 run 自身（[0]），导致 SELF_AGE ≈ 0，永远假阳性。
          # 正确做法：取所有 runs 的第 2 个（index=1），即"上一次的运行"。
          # 如果只有 1 条记录，fallback 到 [0] 但标记为未知。
          RESP=$(curl -sS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/Jackliu-teadrinker/ai-news-radar/actions/workflows/radar-watchdog.yml/runs?per_page=5")
          COUNT=$(echo "$RESP" | jq -r '.total_count // 0')
          echo "Watchdog total runs: $COUNT"
          if [ "$COUNT" = "0" ] || [ "$COUNT" = "null" ]; then
            SELF_RUN_TIME="unknown"
            SELF_AGE_MIN=999
            echo "self_status=unknown_no_runs" >> "$GITHUB_OUTPUT"
          elif [ "$COUNT" -eq 1 ]; then
            # 只有一次记录（当前 run），无法判断自身健康，取当前时间并标记 unknown
            SELF_RUN_TIME=$(echo "$RESP" | jq -r '.workflow_runs[0].created_at')
            SELF_EPOCH=$(date -d "$SELF_RUN_TIME" +%s)
            SELF_AGE_MIN=0
            echo "self_status=unknown_single_run" >> "$GITHUB_OUTPUT"
          else
            # [1] = 上一次独立运行（不是当前这次）
            SELF_RUN_TIME=$(echo "$RESP" | jq -r '.workflow_runs[1].created_at')
            SELF_EPOCH=$(date -d "$SELF_RUN_TIME" +%s)
            SELF_AGE_MIN=$(( ( $(date -u +%s) - SELF_EPOCH ) / 60 ))
            echo "self_status=ok" >> "$GITHUB_OUTPUT"
          fi
          echo "Previous watchdog run age: ${SELF_AGE_MIN} min"
          echo "self_age_min=$SELF_AGE_MIN" >> "$GITHUB_OUTPUT"

      - name: Open alert issue
        if: steps.status.outputs.action == 'alert'
        uses: actions/github-script@v7
        with:
          script: |
            const updateNewsAge = `${{ steps.update_news_age.outputs.update_news_age_minutes }}`;
            const lastSchedule = `${{ steps.update_news_age.outputs.last_schedule_at }}`;
            const runId = `${{ steps.update_news_age.outputs.update_news_run_id }}`;
            const conclusion = `${{ steps.update_news_age.outputs.update_news_conclusion }}`;
            const selfStatus = `${{ steps.self_monitor.outputs.self_status }}`;
            const selfAge = `${{ steps.self_monitor.outputs.self_age_min }}`;
            const title = `🚨 雷达中断 ${updateNewsAge} 分钟`;
            const body = [
              `Update AI News Radar 最后一次 schedule run 已 ${updateNewsAge} 分钟未执行。`,
              ``,
              `- last_schedule_at: ${lastSchedule}`,
              `- run_id: ${runId}`,
              `- conclusion: ${conclusion}`,
              ``,
              `Watchdog **不**自动触发主采集（避免重复轰炸）。`,
              `请人工检查：https://github.com/Jackliu-teadrinker/ai-news-radar/actions`,
              ``,
              `Watchdog self-monitor: \`${selfStatus}\` (last self-run age: ${selfAge}m)`,
              ``,
              `Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`,
            ].join('\n');
            // Avoid duplicate open issues with same title in last 24h
            const dupes = await github.rest.issues.listForRepo({
              owner: 'Jackliu-teadrinker',
              repo: 'ai-news-radar',
              state: 'open',
              labels: 'radar-broken',
              per_page: 5,
            });
            const exists = dupes.data.find(i => i.title.startsWith('🚨 雷达中断'));
            if (exists) {
              core.notice(`Alert issue already open: #${exists.number}`);
              return;
            }
            await github.rest.issues.create({
              owner: 'Jackliu-teadrinker',
              repo: 'ai-news-radar',
              title,
              body,
              labels: ['radar-broken'],
            });

      - name: Notify main session via OpenClaw webhook
        if: steps.status.outputs.action == 'alert' || steps.self_monitor.outputs.self_status == 'skipped_deeply'
        env:
          OPENCLAW_WEBHOOK_URL: ${{ secrets.OPENCLAW_WEBHOOK_URL }}
          OPENCLAW_GATEWAY_TOKEN: ${{ secrets.OPENCLAW_GATEWAY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$OPENCLAW_WEBHOOK_URL" ]; then
            echo "OPENCLAW_WEBHOOK_URL secret not configured, skipping notification"
            exit 0
          fi
          UPDATE_NEWS_AGE=${{ steps.update_news_age.outputs.update_news_age_minutes }}
          SELF_AGE_MIN=${{ steps.self_monitor.outputs.self_age_min }}
          SELF_STATUS=${{ steps.self_monitor.outputs.self_status }}
          STATUS=${{ steps.status.outputs.status }}
          ACTION=${{ steps.status.outputs.action }}
          PAYLOAD=$(cat <<EOF
          {
            "channel": "webchat",
            "sessionKey": "main",
            "message": "🚨 雷达中断：status=$STATUS action=$ACTION (update_news schedule age=${UPDATE_NEWS_AGE}m, last watchdog self-run=${SELF_AGE_MIN}m, self_monitor=$SELF_STATUS). 仓库: https://github.com/Jackliu-teadrinker/ai-news-radar/actions"
          }
          EOF
          )
          HTTP_CODE=$(curl -sS -o /tmp/notify_resp.txt -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${OPENCLAW_GATEWAY_TOKEN}" \
            -d "$PAYLOAD" \
            "$OPENCLAW_WEBHOOK_URL" || echo "000")
          echo "Notify HTTP: $HTTP_CODE"
          cat /tmp/notify_resp.txt || true
          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Notified main session"
          else
            echo "::warning::Notify failed (HTTP $HTTP_CODE) but not blocking"
          fi

      - name: Checkout (for health.json push)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Jack 2026-06-12: P0 fix — fetch-depth: 0 must be on every push workflow.
          fetch-depth: 0

      - name: Write health JSON + push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_EMAIL: "865715887@qq.com"
          GIT_NAME: "radar-watchdog-bot"
        run: |
          set -euo pipefail
          STATUS="${{ steps.status.outputs.status }}"
          ACTION="${{ steps.status.outputs.action }}"
          # PRIMARY signal: update-news schedule run age
          UPDATE_NEWS_AGE=${{ steps.update_news_age.outputs.update_news_age_minutes }}
          LAST_SCHEDULE_AT="${{ steps.update_news_age.outputs.last_schedule_at }}"
          UPDATE_NEWS_RUN_ID="${{ steps.update_news_age.outputs.update_news_run_id }}"
          # Legacy signals
          COMMIT_AGE=${{ steps.commit_age.outputs.commit_age_minutes }}
          COMMIT_TIME="${{ steps.commit_age.outputs.commit_time }}"
          # Self monitor
          SELF_AGE=${{ steps.self_monitor.outputs.self_age_min }}
          SELF_STATUS="${{ steps.self_monitor.outputs.self_status }}"
          # Run metadata
          CHECKED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          RUN_ID="${{ github.run_id }}"

          git config user.email "$GIT_EMAIL"
          git config user.name "$GIT_NAME"

          mkdir -p data
          cat > data/radar-health.json <<EOF
          {
            "status": "$STATUS",
            "action": "$ACTION",
            "primary_signal": "update_news_schedule_age",
            "update_news_last_schedule_at": "$LAST_SCHEDULE_AT",
            "update_news_age_minutes": $UPDATE_NEWS_AGE,
            "update_news_run_id": "$UPDATE_NEWS_RUN_ID",
            "commit_age_minutes": $COMMIT_AGE,
            "last_commit_at": "$COMMIT_TIME",
            "watchdog_self_status": "$SELF_STATUS",
            "watchdog_self_age_minutes": $SELF_AGE,
            "checked_at": "$CHECKED_AT",
            "watchdog_run_id": "$RUN_ID"
          }
          EOF
          echo "--- data/radar-health.json ---"
          cat data/radar-health.json
          echo "------------------------------"

          git add data/radar-health.json
          # Only commit if changed
          if git diff --cached --quiet; then
            echo "No changes to commit (status unchanged since last run)"
            exit 0
          fi
          git commit -m "watchdog: status=$STATUS update_news_age=${UPDATE_NEWS_AGE}min"
          # Strict push: fail loudly (P0 lesson — never trust silent success)
          if ! git push origin master; then
            echo "::error::Push failed — watchdog health.json not updated"
            exit 1
          fi
          echo "Pushed health.json to master"
