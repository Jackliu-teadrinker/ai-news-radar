name: Deploy AI News Radar to Pages

on:
  push:
    branches:
      - radar-data
    paths:
      - "data/**"
      - "index.html"
      - "assets/**"

concurrency:
  group: radar-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout radar-data
        uses: actions/checkout@v4
        with:
          ref: radar-data

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
