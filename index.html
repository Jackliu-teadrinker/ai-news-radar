    />
    <link rel="icon" href="./assets/logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./assets/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <div class="hero-main">
          <div class="hero-headline">
            <img class="hero-logo" src="./assets/logo.svg" alt="机器人新闻雷达 Logo" />
            <div>
              <p class="hero-tag">机器人新闻雷达</p>
              <h1>24 小时机器人更新雷达</h1>
            </div>
          </div>
          <p class="hero-sub">
            过去 24 小时值得看的机器人、具身智能、脑机接口精准更新。
          </p>
        </div>
        <div class="hero-meta">
          <span class="updated-label">更新时间</span>
          <span class="updated" id="updatedAt">加载中...</span>
        </div>

        <section class="stats" id="stats"></section>

        <section class="coverage-strip" id="coverageStrip" aria-label="Source coverage status"></section>
      </header>

      <section class="primary-controls">
        <input id="searchInput" type="search" placeholder="搜索机器人信号 / 来源" />
        <div class="mode-hint" id="modeHint">机器人强相关</div>
        <select id="sortSelect" title="排序方式">
          <option value="time">🕐 时间最新</option>
          <option value="priority">🔢 分区优先级</option>
          <option value="total_score">⭐ 五维总分</option>
          <option value="relevance">🎯 相关性</option>
          <option value="authority">🏛️ 权威性</option>
          <option value="depth">📊 内容深度</option>
          <option value="timeliness">⏰ 时效性</option>
        </select>
      </section>

      <details class="advanced-panel">
        <summary>
          <span>高级筛选与源状态</span>
          <span class="advanced-summary" id="advancedSummary">加载中...</span>
        </summary>
        <div class="advanced-content">
          <div class="advanced-controls">
            <label class="field">
              <span>站点</span>
              <select id="siteSelect">
                <option value="">全部站点</option>
              </select>
            </label>
            <div class="field">
              <span>视图</span>
              <div class="mode-switch">
                <button id="modeAiBtn" class="mode-btn active" type="button">机器人强相关</button>
                <button id="modeAllBtn" class="mode-btn" type="button">全量</button>
              </div>
            </div>
            <label id="allDedupeWrap" class="all-dedupe" for="allDedupeToggle">
              <input id="allDedupeToggle" type="checkbox" checked />
              <span class="all-dedupe-dot"></span>
              <span id="allDedupeLabel">去重开</span>
            </label>
            <!-- Jack 2026-05-15: 今日9点CST分界线 -->
            <label id="todayCutoffWrap" class="all-dedupe" for="todayCutoffToggle">
              <input id="todayCutoffToggle" type="checkbox" checked />
              <span class="all-dedupe-dot"></span>
              <span id="todayCutoffLabel">昨日9点后</span>
            </label>
          </div>
          <div class="source-health" id="sourceHealth">源状态加载中...</div>
          <section class="site-pills" id="sitePills"></section>
        </div>
      </details>

      <section class="list-wrap">
        <div class="list-head">
          <h2 id="listTitle">机器人信号流</h2>
          <span id="resultCount">0 条</span>
        </div>
        <div id="newsList" class="news-list"></div>
      </section>
    </main>

    <template id="itemTpl">
      <article class="news-card">
        <div class="meta-row">
          <span class="site"></span>
          <span class="category"></span>
          <span class="source"></span>
          <span class="score score-none">--</span>
          <time class="time"></time>
        </div>
        <a class="title" target="_blank" rel="noopener noreferrer"></a>
      </article>
    </template>

    <script src="./assets/app.js?sha=6583c4bdf332dde12bdfd5443d854db7b52161e7" defer></script>
