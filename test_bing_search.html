<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bing 搜索测试</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .result { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 8px; }
        .result h3 { margin: 0 0 10px 0; }
        .result a { color: #1a0dab; text-decoration: none; }
        .result a:hover { text-decoration: underline; }
        .result .url { color: #006621; font-size: 14px; }
        .result .snippet { color: #545454; font-size: 14px; margin-top: 5px; }
    </style>
</head>
<body>
    <h1>Bing 搜索测试</h1>
    <div id="results"></div>
    
    <script>
        async function testSearch() {
            const keywords = ['人形机器人', '具身智能', '物理AI'];
            const resultsDiv = document.getElementById('results');
            
            for (const kw of keywords) {
                const url = `https://cn.bing.com/search?q=${encodeURIComponent(kw)}`;
                
                try {
                    const resp = await fetch(url, {
                        headers: {
                            'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36'
                        }
                    });
                    
                    const html = await resp.text();
                    console.log(`Search "${kw}": status=${resp.status}, length=${html.length}`);
                    
                    // 解析结果
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, 'text/html');
                    const algoItems = doc.querySelectorAll('.b_algo');
                    console.log(`Found ${algoItems.length} results for "${kw}"`);
                    
                    // 显示前几个结果
                    algoItems.slice(0, 3).forEach((item, i) => {
                        const link = item.querySelector('a');
                        const snippet = item.querySelector('.b_caption p') || item.querySelector('p');
                        
                        if (link) {
                            const div = document.createElement('div');
                            div.className = 'result';
                            div.innerHTML = `
                                <h3><a href="${link.href}" target="_blank">${link.textContent}</a></h3>
                                <div class="url">${link.href}</div>
                                <div class="snippet">${snippet ? snippet.textContent.substring(0, 100) + '...' : ''}</div>
                            `;
                            resultsDiv.appendChild(div);
                        }
                    });
                } catch (e) {
                    console.error(`Error searching "${kw}":`, e);
                }
            }
        }
        
        testSearch();
    </script>
</body>
</html>
